# --- Site (SEO/GEO basics) ------------------------------------------------------
# Absolute origin for canonical/Open Graph URLs and the sitemap.
matchoracle.site.base-url=http://localhost:8080
%prod.matchoracle.site.base-url=https://rasen-radar.de
# Trust Traefik's X-Forwarded-Proto (set by the "rasenradar-headers" middleware) so
# redirects RESTEasy builds itself (e.g. "/" -> "/bl1") use https, not the plain http
# Traefik speaks to this container over — without this, visitors got bounced through an
# extra http-then-https hop on every first request. Only ever relevant behind Traefik.
%prod.quarkus.http.proxy.proxy-address-forwarding=true

# --- Datasource ---------------------------------------------------------------
# In dev/test mode the connection details come from compose-devservices.yml.
# For prod, set QUARKUS_DATASOURCE_JDBC_URL / _USERNAME / _PASSWORD via environment.
quarkus.datasource.db-kind=postgresql

# --- Schema: Flyway owns the schema, Hibernate only validates it ---------------
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Dev conveniences ------------------------------------------------------------
%dev.quarkus.hibernate-orm.log.sql=false
# Keep the Postgres container and its volume across dev-mode restarts (default is `compose down -v`).
# Stop it manually with: docker compose -p quarkus-devservices-match-oracle down
%dev.quarkus.compose.devservices.stop-services=false
%dev.quarkus.compose.devservices.remove-volumes=false
# Ryuk (the Testcontainers reaper) would still delete containers AND volumes when the JVM exits
%dev.quarkus.compose.devservices.ryuk-enabled=false

# snake_case columns and tables (homeTeam -> home_team_id), matching the Flyway migrations
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Matchday (Spec 01) --------------------------------------------------------
# A result becomes FINAL once kickoff and the last source change are this long ago (ISO-8601 duration).
matchoracle.matchday.final-after=PT24H
# External source (OpenLigaDB). Change check every sync-interval for the current matchday +/- sync-window.
quarkus.rest-client.openligadb.url=https://api.openligadb.de
matchoracle.matchday.sync-interval=15m
matchoracle.matchday.sync-window=1
# Seasons kept as history in addition to the current one (initial import, once per season)
matchoracle.matchday.history-seasons=5
# The scheduler runs the first sync right at startup; tests must not hit the source
%test.quarkus.scheduler.enabled=false
# Form = the last N played matches of a team in the current season
matchoracle.matchday.form-matches=5
# How long after kickoff a match still shows as "läuft" in the UI — no live score, just the label (ISO-8601 duration).
matchoracle.matchday.live-window=PT2H30M

# --- Forecast (Spec 02): automatic triggering ("Terminplanung") -----------------------
# How often the current matchday's unplayed matches are checked (ISO-8601 durations). A match
# without any attempt is forecast right away; a usable forecast is refreshed once it is older
# than refresh-after; a failed attempt (run threw, or no assessment worked) is retried after
# retry-after — noticeably sooner, but never in a tight loop when e.g. the API credits are gone.
matchoracle.forecast.auto.check-every=PT1H
matchoracle.forecast.auto.retry-after=PT1H
matchoracle.forecast.auto.refresh-after=PT24H
# Upper bound per run so a single tick cannot fire more AI calls than one full matchday.
matchoracle.forecast.auto.max-per-run=9

# --- Forecast (Spec 02): agents on a hosted model with a local fallback ---------------
# Default model: local Ollama. Named model "cloud": Anthropic. The agents use a
# FallbackChatModel that tries "cloud" first and falls back to the local model when
# the cloud is unreachable, the key is missing/invalid or the credits are used up.
quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.ollama.base-url=http://localhost:11434
# gemma4:12b without thinking answers in ~3s; qwen3.6:27b-mlx is better but ~10x slower
quarkus.langchain4j.ollama.chat-model.model-name=gemma4:12b
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.chat-model.format=json
# thinking models spend most of their time reasoning; off for now, the fact sheets are pre-digested
quarkus.langchain4j.ollama.chat-model.model-options.think=false
quarkus.langchain4j.ollama.chat-model.model-options.num-ctx=8192
# small local models occasionally loop past valid JSON (repeated closing brackets) instead of
# stopping; without a cap that runs until num-ctx and wastes the retry too. Responses here are a
# short JSON object plus at most three sentences - 600 tokens is generous headroom, not a squeeze.
quarkus.langchain4j.ollama.chat-model.model-options.num-predict=600
quarkus.langchain4j.ollama.log-requests=false
quarkus.langchain4j.ollama.log-responses=false
# Ollama already runs on this machine; never let Quarkus start a second one
quarkus.langchain4j.ollama.devservices.enabled=false

quarkus.langchain4j.cloud.chat-model.provider=anthropic
# set ANTHROPIC_API_KEY in the environment; without it every cloud call fails and the local model answers
quarkus.langchain4j.anthropic.cloud.api-key=${ANTHROPIC_API_KEY:missing}
quarkus.langchain4j.anthropic.cloud.chat-model.model-name=claude-sonnet-5
quarkus.langchain4j.anthropic.cloud.chat-model.max-tokens=2048
# Anthropic's default is 1.0; lower keeps the JSON tidy (no typographic quotes) and the forecasts steadier
quarkus.langchain4j.anthropic.cloud.chat-model.temperature=0.3
# structured output: with "json" the adapter declares JSON-schema support, the AI service sends the
# answer schema as response format and the model cannot break the JSON (e.g. with typographic quotes)
quarkus.langchain4j.anthropic.cloud.chat-model.response-format=json
# the system prompts repeat for every call: cache them (cache reads cost ~10% of the input price)
quarkus.langchain4j.anthropic.cloud.chat-model.cache-system-messages=true
quarkus.langchain4j.anthropic.cloud.log-requests=false
quarkus.langchain4j.anthropic.cloud.log-responses=false
# whether the cloud model is tried at all (false = local only, e.g. to compare models)
matchoracle.forecast.cloud-enabled=true
quarkus.langchain4j.timeout=180s
# The Dev UI agent monitor cannot track the three parallel assessors ("No ongoing parent invocation
# found") and logs an ERROR per agent; the runs themselves are fine. Quiet until fixed upstream.
%dev.quarkus.log.category."dev.langchain4j.agentic.observability.ListenerNotifierUtil".level=OFF

# --- Review (Spec 03) ----------------------------------------------------------
matchoracle.review.min-similar-cases=3
matchoracle.review.max-similar-cases=5
matchoracle.review.min-evaluations=10
matchoracle.review.form-matches=5
# situations for results that were final before the review existed
matchoracle.review.catch-up-interval=10m
