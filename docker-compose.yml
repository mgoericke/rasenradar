# Minimal local setup — pulls the published image from GHCR, no build step needed.
# Just `docker compose up` and open http://localhost:8080.
#
# This is NOT the production stack (no Traefik, no TLS, no Basic Auth) — see deployment/
# for that. It's also unrelated to compose-devservices.yml, which Quarkus Dev Services
# manages automatically for `./mvnw quarkus:dev`.
#
# KI-Vorschau (AI forecasts) needs an Anthropic API key; export ANTHROPIC_API_KEY before
# starting if you want to try it. Everything else — matchdays, tables, clubs, existing
# forecasts, Trefferbilanz — works without one.
#
# The image is linux/amd64 only; on Apple Silicon Docker Desktop runs it under emulation
# (works fine, just a slower start).
services:
  app:
    image: ghcr.io/mgoericke/rasenradar:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/matchoracle
      QUARKUS_DATASOURCE_USERNAME: matchoracle
      QUARKUS_DATASOURCE_PASSWORD: matchoracle
      QUARKUS_LANGCHAIN4J_ANTHROPIC_CLOUD_API_KEY: ${ANTHROPIC_API_KEY:-}

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: matchoracle
      POSTGRES_PASSWORD: matchoracle
      POSTGRES_DB: matchoracle
    volumes:
      - rasenradar-local-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U matchoracle" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  rasenradar-local-data:
