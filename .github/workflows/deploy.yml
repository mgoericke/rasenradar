name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deployment/"
          target: "/opt/markserver-cloud/rasenradar"
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/markserver-cloud/rasenradar
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.DEPLOY_USER }} --password-stdin
            IMAGE_TAG=${{ inputs.image_tag }} docker compose pull
            IMAGE_TAG=${{ inputs.image_tag }} docker compose up -d --remove-orphans
            docker image prune -f

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://rasenradar.markserver.de/app.css","https://rasenradar.markserver.de/match.js","https://rasenradar.markserver.de/accuracy.js"]}'
