# Deployment stack for Rasen-Radar – mit KI-Vorschau (rasen-radar.de).
# Traefik reverse proxy is expected to run in the "proxy" network (external).
# rasenradar.markserver.de is the old host; it now only exists to 301-redirect to rasen-radar.de.

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # match-oracle application
  # ─────────────────────────────────────────────────────────────────────────────
  rasenradar:
    image: ghcr.io/mgoericke/rasenradar:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    environment:
      QUARKUS_PROFILE: prod
      # Database
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/matchoracle
      QUARKUS_DATASOURCE_USERNAME: matchoracle
      QUARKUS_DATASOURCE_PASSWORD: ${MATCHORACLE_DB_PASSWORD}
      QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
      # Model: Anthropic Sonnet only. No local Ollama on this server — the prod profile
      # switches the local fallback off, so a failed cloud call reports its own error
      # and the Terminplanung retries the forecast an hour later.
      QUARKUS_LANGCHAIN4J_ANTHROPIC_CLOUD_API_KEY: ${ANTHROPIC_API_KEY}
      # Visitor statistics: empty until the website has been created in Umami (see DEPLOYMENT.md).
      # Empty means no tracker in the page at all — the site works either way.
      MATCHORACLE_ANALYTICS_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/q/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.rasenradar.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.rasenradar-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Public router: the whole site (viewing matchdays, matches, clubs, forecasts, hit rate) stays open.
      - "traefik.http.routers.rasenradar.rule=Host(`rasen-radar.de`)"
      - "traefik.http.routers.rasenradar.entrypoints=websecure"
      - "traefik.http.routers.rasenradar.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rasenradar.service=rasenradar"
      - "traefik.http.routers.rasenradar.middlewares=rasenradar-headers"
      - "traefik.http.routers.rasenradar.priority=1"
      # Write router: every POST (create a forecast/backtest, change the forecast parameters — the
      # only actions that cost money or change shared state) needs Basic Auth. Higher priority wins
      # over the public router above for the same request.
      - "traefik.http.routers.rasenradar-write.rule=Host(`rasen-radar.de`) && Method(`POST`)"
      - "traefik.http.routers.rasenradar-write.entrypoints=websecure"
      - "traefik.http.routers.rasenradar-write.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rasenradar-write.service=rasenradar"
      - "traefik.http.routers.rasenradar-write.middlewares=rasenradar-headers,rasenradar-auth"
      - "traefik.http.routers.rasenradar-write.priority=10"
      # Basic Auth (htpasswd-Format, $-Zeichen in .env nicht escapen — siehe .env.example)
      - "traefik.http.middlewares.rasenradar-auth.basicauth.users=${BASIC_AUTH_USERS}"
      - "traefik.http.middlewares.rasenradar-auth.basicauth.realm=Rasen-Radar KI-Vorschau ausloesen"
      # Old domain (previous SEO decision, kept for anyone with an old bookmark/link):
      # a plain 301 to the same path on the new domain. No Basic Auth needed here — POSTs
      # coming through this redirect land on rasen-radar.de and get checked there.
      - "traefik.http.middlewares.rasenradar-old-domain-redirect.redirectregex.regex=^https://rasenradar\\.markserver\\.de/(.*)"
      - "traefik.http.middlewares.rasenradar-old-domain-redirect.redirectregex.replacement=https://rasen-radar.de/$${1}"
      - "traefik.http.middlewares.rasenradar-old-domain-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.rasenradar-old-domain.rule=Host(`rasenradar.markserver.de`)"
      - "traefik.http.routers.rasenradar-old-domain.entrypoints=websecure"
      - "traefik.http.routers.rasenradar-old-domain.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rasenradar-old-domain.service=rasenradar"
      - "traefik.http.routers.rasenradar-old-domain.middlewares=rasenradar-old-domain-redirect"

  # ─────────────────────────────────────────────────────────────────────────────
  # Umami — visitor statistics, self-hosted. Cookie-free and without personal data, so the
  # site needs no consent banner. Shares the Postgres instance above; its database "umami"
  # has to be created once by hand (see DEPLOYMENT.md), because the volume already exists
  # and Postgres only runs its init scripts on a fresh one.
  # ─────────────────────────────────────────────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
    # Umami runs its own schema migrations at startup and reaps old data itself;
    # init: true gives the Node process a proper PID 1 so it stops cleanly.
    init: true
    environment:
      DATABASE_URL: postgresql://matchoracle:${MATCHORACLE_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      # Own subdomain, own certificate. The dashboard has its own login — do change the
      # default password on the first visit, the instance is reachable from the internet.
      - "traefik.http.routers.umami.rule=Host(`stats.rasen-radar.de`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami.service=umami"

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — plain, no extensions needed (dev uses the same image)
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: matchoracle
      POSTGRES_PASSWORD: ${MATCHORACLE_DB_PASSWORD}
      POSTGRES_DB: matchoracle
    volumes:
      # postgres 18+ images store data in a version-specific subdirectory;
      # mount the parent so that future pg_upgrade works across major versions
      - rasenradar-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U matchoracle" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rasenradar-postgres-data:

networks:
  proxy:
    external: true
  internal:
    driver: bridge
